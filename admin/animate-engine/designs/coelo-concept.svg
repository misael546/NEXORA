<title id="title">NEXORA — Coelo, diseño 2D</title>
<desc id="desc">Diseño original de Coelo: pequeño terópodo bípedo, rápido y atlético, con piel verde, vientre claro, marcas oscuras, ojos ámbar y cola larga.</desc>
