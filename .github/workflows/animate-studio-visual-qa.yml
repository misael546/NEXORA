name: NEXORA 2D visual QA
on:
  push:
    branches: [main]
    paths:
      - "admin/animate-studio.html"
      - "admin/animate-frames.html"
      - "admin/animate-engine/**"
      - "tests/animate-studio-visual.mjs"
      - "tests/frame-editor-visual.mjs"
      - ".github/workflows/animate-studio-visual-qa.yml"
  pull_request:
    paths:
      - "admin/animate-studio.html"
      - "admin/animate-frames.html"
      - "admin/animate-engine/**"
      - "tests/animate-studio-visual.mjs"
      - "tests/frame-editor-visual.mjs"
      - ".github/workflows/animate-studio-visual-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 2D visual review
        run: node tests/animate-studio-visual.mjs
      - name: Test frame-by-frame editor
        run: node tests/frame-editor-visual.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-animate-visual-qa
          path: |
            artifacts/nexora-2d-visual-qa/
            artifacts/nexora-frame-editor-qa/
          if-no-files-found: warn
          retention-days: 7
