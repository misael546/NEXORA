name: NEXORA ANIMATE engine tests
on:
  push:
    branches: [main]
    paths:
      - "admin/animate-engine/**"
      - "admin/animate-dino-dialogue.html"
      - "admin/animate-studio.html"
      - "tests/animate-engine.test.js"
      - "tests/frame-animation.test.js"
      - ".github/workflows/animate-engine-tests.yml"
  pull_request:
    paths:
      - "admin/animate-engine/**"
      - "tests/animate-engine.test.js"
      - "tests/frame-animation.test.js"
      - ".github/workflows/animate-engine-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run engine tests
        run: node --test tests/animate-engine.test.js tests/frame-animation.test.js
