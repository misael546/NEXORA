name: NEXORA Wallpaper weekly collection
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wallpaper-weekly.yml"
      - ".github/scripts/import-wallpapers.mjs"
permissions:
  contents: write
concurrency:
  group: nexora-wallpaper-weekly
  cancel-in-progress: false
jobs:
  publish-weekly-wallpapers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Discover and publish new wallpapers
        env:
          WALLPAPER_INGEST_URL: ${{ secrets.WALLPAPER_INGEST_URL }}
          WALLPAPER_INGEST_TOKEN: ${{ secrets.WALLPAPER_INGEST_TOKEN }}
          WALLPAPER_ACCESS_CLIENT_ID: ${{ secrets.WALLPAPER_ACCESS_CLIENT_ID }}
          WALLPAPER_ACCESS_CLIENT_SECRET: ${{ secrets.WALLPAPER_ACCESS_CLIENT_SECRET }}
          WALLPAPER_PAGES_PER_TOPIC: "6"
          OPENVERSE_PAGES_PER_TOPIC: "6"
        run: node .github/scripts/import-wallpapers.mjs
      - name: Save Wikimedia search progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/wallpaper-import-state.json
          if git diff --cached --quiet; then
            echo "No cursor changes to save."
          else
            git commit -m "chore: advance NEXORA wallpaper import cursors"
            git fetch origin main
            git rebase origin/main
            git push
          fi
