<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="theme-color" content="#090d18"><title>Artículo | NEXORA</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NEXORA<span class="brand-dot">.</span></span></a><a class="nav-cta" href="index.html">Inicio ↗</a></header><main class="content-page"><article class="content-wrap" id="article"><p class="article-kicker">NEXORA</p><h1>Cargando artículo…</h1></article></main><footer class="site-footer"><div class="wrap footer-inner"><a class="brand" href="index.html">NEXORA.</a><span>© NEXORA</span></div></footer><script>
(async()=>{const root=document.getElementById("article"),slug=new URLSearchParams(location.search).get("slug");if(!slug){root.innerHTML="<h1>Artículo no encontrado</h1><a href='index.html'>Volver al inicio</a>";return}try{const r=await fetch("/api/articles");if(!r.ok)throw 0;const d=await r.json(),a=(d.articles||[]).find(x=>x.slug===slug);if(!a)throw 0;document.title=a.title+" | NEXORA";const kicker=document.createElement("div");kicker.className="article-kicker";kicker.textContent=a.category;const h=document.createElement("h1");h.textContent=a.title;const deck=document.createElement("p");deck.className="article-deck";deck.textContent=a.excerpt||"";const by=document.createElement("div");by.className="article-byline";by.textContent="NEXORA · "+new Date(a.published_at).toLocaleDateString("es-MX");const prose=document.createElement("div");prose.className="prose";(a.content||"").split(/\n\s*\n/).forEach(t=>{if(t.trim()){const p=document.createElement("p");p.textContent=t.trim();prose.append(p)}});root.replaceChildren(kicker,h,deck,by,prose)}catch{root.innerHTML="<h1>Artículo no disponible</h1><p class='article-deck'>Puede que haya sido retirado o que todavía no esté publicado.</p><a href='index.html'>Volver a NEXORA</a>"}})();
</script></body></html>
